<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat de Recados & Bot - Power Dance</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: transparent;
      overflow: hidden;
      position: relative;
    }

    /* ESTRUTURA DO CHAT */
    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 10px;
      background-color: rgba(15, 15, 118, 0.15);
    }

    .messagesContainer {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      border: 1px solid rgba(0, 212, 255, 0.3);
      padding: 12px;
      border-radius: 8px;
      color: #f0f8ff;
      background-color: rgba(0, 0, 0, 0.55);
      position: relative;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      word-break: break-word;
      overflow-wrap: anywhere;
      transition: opacity 0.3s ease;
    }

    .message.bot-msg {
      border-color: #00ff88;
      background-color: rgba(0, 40, 20, 0.7);
    }

    .message img.avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #00d4ff;
      flex-shrink: 0;
    }

    .message .content {
      flex: 1;
      font-size: 18px;
      line-height: 1.3;
    }

    .message .name {
      font-weight: bold;
      color: #00d4ff;
      font-size: 16px;
      margin-bottom: 2px;
      text-shadow: 0 0 5px rgba(0, 212, 255, 0.5);
    }

    .message .email {
      color: #d4d117;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .message .text {
      font-size: 22px;
      font-weight: 500;
      color: #ffffff;
      line-height: 1.4;
    }

    .message .timestamp {
      font-size: 11px;
      color: #aaa;
      margin-top: 6px;
      text-align: right;
    }

    .admin-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .admin-btn {
      background: rgba(255, 0, 0, 0.3);
      border: 1px solid #ff4444;
      color: #fff;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }

    .admin-btn:hover {
      background: rgba(255, 0, 0, 0.7);
    }

    .admin-btn.edit {
      background: rgba(255, 170, 0, 0.3);
      border-color: #ffaa00;
    }

    .admin-btn.edit:hover {
      background: rgba(255, 170, 0, 0.7);
    }

    /* RODAPÉ DO CHAT */
    .footer {
      display: flex;
      align-items: center;
      padding: 8px;
      background-color: rgba(10, 20, 40, 0.9);
      border-top: 1px solid #00d4ff;
      position: relative;
      z-index: 100;
    }

    .input-row {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 8px;
    }

    .emoji-trigger-btn {
      background: none;
      border: none;
      font-size: 28px;
      cursor: pointer;
      line-height: 1;
      transition: transform 0.2s;
    }

    .emoji-trigger-btn:hover {
      transform: scale(1.15);
    }

    .footer textarea {
      flex: 1;
      height: 56px;
      padding: 10px 12px;
      border: 2px solid #00d4ff;
      border-radius: 8px;
      font-size: 16px;
      font-family: Arial, sans-serif;
      resize: none;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      outline: none;
    }

    .footer button.send-btn {
      padding: 0 18px;
      height: 56px;
      border: none;
      border-radius: 8px;
      background-color: #00d4ff;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .footer button.send-btn:hover {
      background-color: #0099cc;
    }

    .footer button.send-btn:disabled {
      background-color: #444;
      color: #888;
      cursor: not-allowed;
    }

    /* MOSTRUÁRIO DE EMOJIS */
    .emoji-picker-modal {
      display: none;
      position: absolute;
      bottom: 75px;
      left: 10px;
      right: 10px;
      max-width: 500px;
      margin: 0 auto;
      z-index: 99;
    }

    .emoji-picker-modal.active {
      display: flex;
    }

    .emoji-picker-content {
      width: 100%;
      background: rgba(10, 25, 50, 0.95);
      border-radius: 12px;
      height: 250px;
      display: flex;
      flex-direction: column;
      border: 2px solid #00d4ff;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
    }

    .emoji-picker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(5, 12, 35, 0.9);
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      border-bottom: 1px solid rgba(0, 212, 255, 0.2);
    }

    .emoji-picker-header h3 {
      color: #00d4ff;
      font-size: 14px;
    }

    .close-emoji-btn {
      background: none;
      border: none;
      color: #d0e8ff;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .emoji-tabs {
      display: flex;
      overflow-x: auto;
      background: rgba(5, 12, 35, 0.8);
      padding: 4px 8px;
      gap: 8px;
    }

    .emoji-tab-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      opacity: 0.6;
    }

    .emoji-tab-btn.active {
      opacity: 1;
      border-bottom: 2px solid #00d4ff;
    }

    .emoji-grid-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
      gap: 6px;
    }

    .emoji-item {
      font-size: 24px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .emoji-item:hover {
      transform: scale(1.2);
    }

    .notification {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #00d4ff;
      color: #000;
      padding: 6px 16px;
      border-radius: 20px;
      z-index: 1001;
      font-size: 13px;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(0,212,255,0.8);
    }

    /* PAINEL ADMIN E HISTÓRICO DE PEDIDOS */
    .admin-bar {
      display: none;
      background: #050c23;
      border-bottom: 1px solid #00d4ff;
      padding: 6px 12px;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      font-size: 12px;
    }

    .admin-bar-btns {
      display: flex;
      gap: 8px;
    }

    .admin-bar-btn {
      background: #00d4ff;
      color: #000;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: #0a1932;
      border: 2px solid #00d4ff;
      border-radius: 10px;
      width: 100%;
      max-width: 600px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      padding: 15px;
      color: #fff;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      background: rgba(255,255,255,0.05);
      border-left: 3px solid #00d4ff;
      padding: 8px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- BARRA ADMIN DE NAVEGAÇÃO -->
  <div class="admin-bar" id="adminBar">
    <span>Painel Admin Ativo</span>
    <div class="admin-bar-btns">
      <button class="admin-bar-btn" id="btnOpenOnline">Usuários Online (<span id="onlineCount">0</span>)</button>
      <button class="admin-bar-btn" id="btnOpenHistory">Histórico de Pedidos</button>
    </div>
  </div>

  <div class="container">
    <div class="messagesContainer" id="messagesContainer"></div>
  </div>

  <!-- EMOJIS PICKER -->
  <div class="emoji-picker-modal" id="emojiModal">
    <div class="emoji-picker-content">
      <div class="emoji-picker-header">
        <h3>Selecione um Emoji</h3>
        <button type="button" class="close-emoji-btn" id="closeEmojiModal">&times;</button>
      </div>
      <div class="emoji-tabs" id="emojiTabs"></div>
      <div class="emoji-grid-container" id="emojiGrid"></div>
    </div>
  </div>

  <!-- RODAPÉ DA MENSAGEM -->
  <div class="footer">
    <div class="input-row">
      <button type="button" class="emoji-trigger-btn" id="openEmojiModal" title="Escolher Emoji">😀</button>
      <textarea id="messageInput" placeholder="Faça login no site para enviar um recado..." disabled maxlength="150"></textarea>
      <button id="submitMessage" class="send-btn" disabled>Enviar</button>
    </div>
  </div>

  <!-- MODAL DE HISTÓRICO DE PEDIDOS E RELATÓRIO TXT -->
  <div class="modal-overlay" id="modalHistory">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Histórico Auditável de Pedidos</h3>
        <button class="admin-bar-btn" id="btnExportTxt">Baixar Relatório (.txt)</button>
        <button class="close-emoji-btn" id="closeHistoryModal">&times;</button>
      </div>
      <div class="modal-body" id="historyList"></div>
    </div>
  </div>

  <!-- MODAL DE USUÁRIOS ONLINE -->
  <div class="modal-overlay" id="modalOnline">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Usuários Conectados Agora</h3>
        <button class="close-emoji-btn" id="closeOnlineModal">&times;</button>
      </div>
      <div class="modal-body" id="onlineList"></div>
    </div>
  </div>

  <div id="notificationContainer"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getDatabase, ref, push, onChildAdded, onChildRemoved, onChildChanged, query, limitToLast, remove, set, get, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDDMNEQL0Cj6eXtAISqtBpYiYbkEOoLkqM",
      authDomain: "recados-fca7e.firebaseapp.com",
      databaseURL: "https://recados-fca7e-default-rtdb.firebaseio.com",
      projectId: "recados-fca7e",
      storageBucket: "recados-fca7e.appspot.com",
      messagingSenderId: "637659136101",
      appId: "1:637659136101:web:ac2db24f4c9eef2efe068c",
      measurementId: "G-ZE733KFTMF"
    };

    const ADMIN_EMAIL = "edsonporfiriodarocha12345@gmail.com";
    const TEMPO_EXPIRACAO_MS = 30 * 60 * 1000; // 30 Minutos em milissegundos

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    let isAdmin = false;
    let pedidosCache = [];

    const bannedWords = [
      "seu negro","sua negra", "prostituta", "viado", "boiola", "talarico", "bosta", "rola", "pica", "https","maconha","cocaína","corrupção","cade?","cadê","repetida","repete muito",
      "foda", "buceta", "piroca", "jeba", "estrupar", "estrupador", "traveco", "piranha","http","lula","LULA","LADÃO","ladrão","bandido","não toca","cade","muito chato","porcaria","toca musicas de verdade",
      "biscate", "satanas", "cú", "cu", "boasuda", "arrombado", "vadia", "bucetuda", "gozar", "bit.ly","radioweb","arrombado","paya","podre","repetida","muito chata","lixão",
      "merda", "cocô", "cagada", "cagado","petista","meu pau","toba","flavio bolsonaro","flávio bolsonaro","webradio","@","paia","fudido","derrubada","plagio","que lixo","podre",
      "você nem é", "nem dj você é","nunca tevi tocando","só toca","as mesmas","toca raul","toca sertanejo","toca musica que presta ","toque algo que preste","toca pagode",
    ];

    function possuiPalavraProibida(texto) {
      const textoLimpo = texto.toLowerCase();
      return bannedWords.some(palavra => {
        const palavraEscapada = palavra.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(`\\b${palavraEscapada}\\b`, 'i');
        return regex.test(textoLimpo);
      });
    }

    /* ROTINA PARA APAGAR MENSAGENS COM MAIS DE 30 MINUTOS */
    async function limparMensagensAntigas() {
      const agora = Date.now();
      const messagesRef = ref(database, 'messages');
      try {
        const snapshot = await get(messagesRef);
        if (snapshot.exists()) {
          const data = snapshot.val();
          Object.keys(data).forEach(id => {
            const msg = data[id];
            if (msg.timestamp && (agora - msg.timestamp > TEMPO_EXPIRACAO_MS)) {
              remove(ref(database, `messages/${id}`));
            }
          });
        }
      } catch (err) {
        console.error("Erro na auto-limpeza:", err);
      }
    }

    // Executa a limpeza imediatamente ao carregar e depois a cada 30 segundos
    limparMensagensAntigas();
    setInterval(limparMensagensAntigas, 30000);

    const emojiCategories = {
      "😀": ["😀","😃","😄","😁","😆","😅","😂","🤣","🥲","☺️","😊","😇","🙂","🙃","😉","😌","😍","🥰","😘","😗","😙","😚","😋","😛","😝","😜","🤪","🤨","🧐","🤓","😎","🥸","🤩","🥳","😏","😒","😞","😔","😟","😕","🙁","☹️","😣","😖","😫","😩","🥺","😢","😭","😤","😠","😡","🤬","🤯","😳","🥵","🥶","😱","😨","😰","😥","😓","🤗","🤔","🤭","🤫","🤥","😶","😐","😑","😬","🙄","😯","😦","😧","😮","😲","🥱","😴","🤤","😪","😵","🤐","🥴","🤢","🤮","🤧","😷","🤒","🤕"],
      "👋": ["👋","🤚","🖐️","✋","🖖","👌","🤌","🤏","✌️","🤞","🤟","🤘","🤙","👈","👉","👆","🖕","👇","☝️","👍","👎","✊","👊","🤛","🤜","👏","🙌","👐","🤲","🤝","🙏","✍️","💅","🤳","💪","🦾","🦿","🦵","🦶","耳朵","🦻","👃","🧠","🫀","🫁","🦷","骨","👀","👁️","👅","👄"],
      "❤️": ["❤️","🧡","💛","💚","💙","💜","🖤","🤍","🤎","💔","❣️","💕","💞","💓","💗","💖","💘","💝","💟","☮️","✝️","☪️","🕉️","☸️","✡️","#️⃣","🕎","☯️","☦️","🛐","⛎","♈","♉","♊","♋","♌","♍","♎","♏","♐","♑","♒","♓"],
      "🎵": ["🎵","🎶","🎼","🎧","🎤","🎙️","🎚️","🎛️","📻","🎷","🎸","🎹","🎺","🎻","🪕","🥁","🪘"]
    };

    function renderEmojiPicker() {
      const tabsContainer = document.getElementById('emojiTabs');
      const gridContainer = document.getElementById('emojiGrid');
      tabsContainer.innerHTML = '';
      gridContainer.innerHTML = '';

      let first = true;
      for (const cat in emojiCategories) {
        const tabBtn = document.createElement('button');
        tabBtn.className = `emoji-tab-btn ${first ? 'active' : ''}`;
        tabBtn.innerText = cat;
        tabBtn.onclick = () => {
          document.querySelectorAll('.emoji-tab-btn').forEach(b => b.classList.remove('active'));
          tabBtn.classList.add('active');
          renderEmojis(cat);
        };
        tabsContainer.appendChild(tabBtn);

        if (first) {
          renderEmojis(cat);
          first = false;
        }
      }
    }

    function renderEmojis(category) {
      const gridContainer = document.getElementById('emojiGrid');
      gridContainer.innerHTML = '';
      emojiCategories[category].forEach(emo => {
        const item = document.createElement('span');
        item.className = 'emoji-item';
        item.innerText = emo;
        item.onclick = () => {
          const textInput = document.getElementById('messageInput');
          textInput.value += emo;
          textInput.focus();
        };
        gridContainer.appendChild(item);
      });
    }

    document.getElementById('openEmojiModal').onclick = () => {
      document.getElementById('emojiModal').classList.toggle('active');
    };
    document.getElementById('closeEmojiModal').onclick = () => {
      document.getElementById('emojiModal').classList.remove('active');
    };

    function showNotification(text) {
      const c = document.getElementById('notificationContainer');
      c.innerHTML = `<div class="notification">${text}</div>`;
      setTimeout(() => { c.innerHTML = ''; }, 3000);
    }

    /* MONITORAMENTO DE AUTENTICAÇÃO E USUÁRIOS ONLINE */
    onAuthStateChanged(auth, (user) => {
      const txtInput = document.getElementById('messageInput');
      const btnSubmit = document.getElementById('submitMessage');

      if (user) {
        txtInput.disabled = false;
        btnSubmit.disabled = false;
        txtInput.placeholder = "Digite seu recado ou pedido de música...";

        isAdmin = (user.email === ADMIN_EMAIL);
        if (isAdmin) {
          document.getElementById('adminBar').style.display = 'flex';
        }

        // REGISTRA STATUS ONLINE NO FIREBASE
        const userStatusRef = ref(database, `onlineUsers/${user.uid}`);
        set(userStatusRef, {
          name: user.displayName || "Usuário Anônimo",
          email: user.email,
          photo: user.photoURL || "",
          lastSeen: Date.now()
        });
        onDisconnect(userStatusRef).remove();

      } else {
        txtInput.disabled = true;
        btnSubmit.disabled = true;
        txtInput.placeholder = "Faça login no site para enviar um recado...";
      }
    });

    // CONTADOR DE USUÁRIOS ONLINE (ADMIN)
    onValue(ref(database, 'onlineUsers'), (snapshot) => {
      const data = snapshot.val() || {};
      const count = Object.keys(data).length;
      document.getElementById('onlineCount').innerText = count;

      const onlineList = document.getElementById('onlineList');
      onlineList.innerHTML = '';
      Object.values(data).forEach(u => {
        const d = document.createElement('div');
        d.className = 'history-item';
        d.innerHTML = `<strong>${u.name}</strong> (${u.email})`;
        onlineList.appendChild(d);
      });
    });

    /* ENVIO DE MENSAGENS COM AUTO-BOT & HISTÓRICO */
    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      const user = auth.currentUser;

      if (!text || !user) return;

      if (possuiPalavraProibida(text)) {
        showNotification("Sua mensagem contém palavras inadequadas.");
        return;
      }

      input.value = '';

      const msgData = {
        uid: user.uid,
        name: user.displayName || "Ouvinte",
        email: user.email,
        photoURL: user.photoURL || "https://via.placeholder.com/50",
        text: text,
        timestamp: Date.now()
      };

      // 1. Grava a Mensagem Normal no Realtime Database
      await push(ref(database, 'messages'), msgData);

      // 2. Grava no Histórico Permanente (Auditável)
      await push(ref(database, 'pedidos_historico'), msgData);

      // 3. AUTO-BOT DE RESPOSTA AUTOMÁTICA
      setTimeout(async () => {
        const botReply = {
          uid: "bot-system",
          name: "🤖 DJ Power Bot",
          email: "bot@powerdance.com",
          photoURL: "https://cdn-icons-png.flaticon.com/512/4712/4712109.png",
          text: `Olá ${msgData.name}, seu recado foi recebido! O DJ Robert BJ já colocou seu pedido na lista de programação. Valeu pela audiência! 🎧🎶`,
          timestamp: Date.now(),
          isBot: true
        };
        await push(ref(database, 'messages'), botReply);
      }, 1500);
    }

    document.getElementById('submitMessage').onclick = sendMessage;
    document.getElementById('messageInput').onkeydown = (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    };

    /* RENDERIZAÇÃO DAS MENSAGENS NO CHAT */
    const messagesRef = query(ref(database, 'messages'), limitToLast(50));

    onChildAdded(messagesRef, (snapshot) => {
      const data = snapshot.val();
      const id = snapshot.key;
      const container = document.getElementById('messagesContainer');

      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${data.isBot ? 'bot-msg' : ''}`;
      msgDiv.id = `msg-${id}`;

      const dateStr = new Date(data.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      let adminBtns = '';
      if (isAdmin && !data.isBot) {
        adminBtns = `
          <div class="admin-actions">
            <button class="admin-btn edit" onclick="window.editMsg('${id}', '${data.text.replace(/'/g, "\\'")}')">Editar</button>
            <button class="admin-btn" onclick="window.deleteMsg('${id}')">Apagar</button>
          </div>
        `;
      }

      msgDiv.innerHTML = `
        <img class="avatar" src="${data.photoURL}" alt="Avatar">
        <div class="content">
          <div class="name">${data.name}</div>
          <div class="email">${data.email || ''}</div>
          <div class="text" id="text-${id}">${data.text}</div>
          <div class="timestamp">${dateStr}</div>
          ${adminBtns}
        </div>
      `;

      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    });

    onChildRemoved(messagesRef, (snapshot) => {
      const id = snapshot.key;
      const el = document.getElementById(`msg-${id}`);
      if (el) el.remove();
    });

    onChildChanged(messagesRef, (snapshot) => {
      const id = snapshot.key;
      const data = snapshot.val();
      const textEl = document.getElementById(`text-${id}`);
      if (textEl) textEl.innerText = data.text;
    });

    /* FUNÇÕES GLOBAIS DE ADMIN DELETAR E EDITAR */
    window.deleteMsg = (id) => {
      if (confirm("Deseja apagar este recado?")) {
        remove(ref(database, `messages/${id}`));
      }
    };

    window.editMsg = (id, oldText) => {
      const newText = prompt("Edite a mensagem:", oldText);
      if (newText && newText.trim() !== "") {
        set(ref(database, `messages/${id}/text`), newText.trim());
      }
    };

    /* CARREGAR HISTÓRICO PARA EXPORTAR .TXT */
    onValue(ref(database, 'pedidos_historico'), (snapshot) => {
      pedidosCache = [];
      const historyList = document.getElementById('historyList');
      historyList.innerHTML = '';

      if (snapshot.exists()) {
        snapshot.forEach((child) => {
          const item = child.val();
          pedidosCache.push(item);

          const hDiv = document.createElement('div');
          hDiv.className = 'history-item';
          const dt = new Date(item.timestamp).toLocaleString();
          hDiv.innerHTML = `<strong>${item.name}</strong> (${item.email}) - <em>${dt}</em><br>${item.text}`;
          historyList.insertBefore(hDiv, historyList.firstChild);
        });
      }
    });

    /* CONTROLES DE MODAIS E RELATÓRIO TXT */
    document.getElementById('btnOpenHistory').onclick = () => {
      document.getElementById('modalHistory').classList.add('active');
    };
    document.getElementById('closeHistoryModal').onclick = () => {
      document.getElementById('modalHistory').classList.remove('active');
    };

    document.getElementById('btnOpenOnline').onclick = () => {
      document.getElementById('modalOnline').classList.add('active');
    };
    document.getElementById('closeOnlineModal').onclick = () => {
      document.getElementById('modalOnline').classList.remove('active');
    };

    document.getElementById('btnExportTxt').onclick = () => {
      if (pedidosCache.length === 0) {
        alert("Nenhum pedido no histórico para exportar.");
        return;
      }

      let content = "=== HISTÓRICO DE PEDIDOS E RECADOS - POWER DANCE ===\n\n";
      pedidosCache.forEach((p, idx) => {
        const dt = new Date(p.timestamp).toLocaleString();
        content += `[${idx + 1}] Data: ${dt}\nNome: ${p.name}\nEmail: ${p.email}\nMensagem: ${p.text}\n----------------------------------------------------\n`;
      });

      const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `pedidos_powerdance_${new Date().toISOString().slice(0,10)}.txt`;
      a.click();
    };

    renderEmojiPicker();
  </script>
</body>
</html>
