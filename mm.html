<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat de Recados & Bot - Power Dance</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: transparent;
      overflow: hidden;
      position: relative;
    }

    /* TELA DE LOGIN ESTILO AZUL NEON TRANSPARENTE */
    .login-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 12, 35, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-card {
      background: rgba(10, 25, 50, 0.85);
      border: 2px solid #00d4ff;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.4), inset 0 0 15px rgba(0, 212, 255, 0.2);
      border-radius: 15px;
      padding: 30px 25px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      color: #ffffff;
    }

    .login-card h2 {
      margin-bottom: 10px;
      color: #00d4ff;
      text-shadow: 0 0 10px rgba(0, 212, 255, 0.7);
      font-size: 24px;
    }

    .login-card p {
      margin-bottom: 25px;
      font-size: 14px;
      color: #d0e8ff;
    }

    .google-btn {
      width: 100%;
      padding: 12px 20px;
      background-color: #ffffff;
      color: #333333;
      border: 2px solid #00d4ff;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.2s ease;
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
    }

    .google-btn:hover {
      background-color: #f0f8ff;
      box-shadow: 0 0 18px rgba(0, 212, 255, 0.8);
      transform: translateY(-2px);
    }

    .google-btn svg {
      width: 24px;
      height: 24px;
    }

    /* ESTRUTURA DO CHAT */
    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 10px;
      background-color: rgba(15, 15, 118, 0.15);
    }

    .messagesContainer {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      border: 1px solid rgba(0, 212, 255, 0.3);
      padding: 12px;
      border-radius: 8px;
      color: #f0f8ff;
      background-color: rgba(0, 0, 0, 0.55);
      position: relative;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      word-break: break-word;
      overflow-wrap: anywhere;
      transition: opacity 0.3s ease;
    }

    .message.bot-msg {
      border-color: #00ff88;
      background-color: rgba(0, 40, 20, 0.7);
    }

    .message img.avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #00d4ff;
      flex-shrink: 0;
    }

    .message .content {
      flex: 1;
      font-size: 18px;
      line-height: 1.3;
    }

    .message .name {
      font-weight: bold;
      color: #00d4ff;
      font-size: 16px;
      margin-bottom: 2px;
      text-shadow: 0 0 5px rgba(0, 212, 255, 0.5);
    }

    .message .email {
      color: #d4d117;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .message .text {
      font-size: 20px;
      font-weight: 500;
      color: #ffffff;
    }

    .message .timestamp {
      font-size: 11px;
      color: #aaa;
      margin-top: 6px;
      text-align: right;
    }

    .admin-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .admin-btn {
      background: rgba(255, 0, 0, 0.3);
      border: 1px solid #ff4444;
      color: #fff;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }

    .admin-btn:hover {
      background: rgba(255, 0, 0, 0.7);
    }

    .admin-btn.edit {
      background: rgba(255, 170, 0, 0.3);
      border-color: #ffaa00;
    }

    .admin-btn.edit:hover {
      background: rgba(255, 170, 0, 0.7);
    }

    /* RODAPÉ DO CHAT */
    .footer {
      display: flex;
      align-items: center;
      padding: 8px;
      background-color: rgba(10, 20, 40, 0.9);
      border-top: 1px solid #00d4ff;
      position: relative;
      z-index: 100;
    }

    .input-row {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 8px;
    }

    .emoji-trigger-btn {
      background: none;
      border: none;
      font-size: 28px;
      cursor: pointer;
      line-height: 1;
      transition: transform 0.2s;
    }

    .emoji-trigger-btn:hover {
      transform: scale(1.15);
    }

    .footer textarea {
      flex: 1;
      height: 48px;
      padding: 8px 12px;
      border: 2px solid #00d4ff;
      border-radius: 8px;
      font-size: 16px;
      font-family: Arial, sans-serif;
      resize: none;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      outline: none;
    }

    .footer button.send-btn {
      padding: 0 18px;
      height: 48px;
      border: none;
      border-radius: 8px;
      background-color: #00d4ff;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .footer button.send-btn:hover {
      background-color: #0099cc;
    }

    .footer button.send-btn:disabled {
      background-color: #444;
      color: #888;
      cursor: not-allowed;
    }

    /* MOSTRUÁRIO DE EMOJIS */
    .emoji-picker-modal {
      display: none;
      position: absolute;
      bottom: 65px;
      left: 10px;
      right: 10px;
      max-width: 500px;
      margin: 0 auto;
      z-index: 99;
    }

    .emoji-picker-modal.active {
      display: flex;
    }

    .emoji-picker-content {
      width: 100%;
      background: rgba(10, 25, 50, 0.95);
      border-radius: 12px;
      height: 250px;
      display: flex;
      flex-direction: column;
      border: 2px solid #00d4ff;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
    }

    .emoji-picker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(5, 12, 35, 0.9);
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      border-bottom: 1px solid rgba(0, 212, 255, 0.2);
    }

    .emoji-picker-header h3 {
      color: #00d4ff;
      font-size: 14px;
    }

    .close-emoji-btn {
      background: none;
      border: none;
      color: #d0e8ff;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .emoji-tabs {
      display: flex;
      overflow-x: auto;
      background: rgba(5, 12, 35, 0.8);
      padding: 4px 8px;
      gap: 8px;
    }

    .emoji-tab-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      opacity: 0.6;
    }

    .emoji-tab-btn.active {
      opacity: 1;
      border-bottom: 2px solid #00d4ff;
    }

    .emoji-grid-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
      gap: 6px;
    }

    .emoji-item {
      font-size: 24px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .emoji-item:hover {
      transform: scale(1.2);
    }

    .notification {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #00d4ff;
      color: #000;
      padding: 6px 16px;
      border-radius: 20px;
      z-index: 1001;
      font-size: 13px;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(0,212,255,0.8);
    }

    /* PAINEL ADMIN E HISTÓRICO DE PEDIDOS */
    .admin-bar {
      display: none;
      background: #050c23;
      border-bottom: 1px solid #00d4ff;
      padding: 6px 12px;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      font-size: 12px;
    }

    .admin-bar-btns {
      display: flex;
      gap: 8px;
    }

    .admin-bar-btn {
      background: #00d4ff;
      color: #000;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: #0a1932;
      border: 2px solid #00d4ff;
      border-radius: 10px;
      width: 100%;
      max-width: 600px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      padding: 15px;
      color: #fff;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      background: rgba(255,255,255,0.05);
      border-left: 3px solid #00d4ff;
      padding: 8px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="container">

  <!-- EMOJIS PICKER -->
  <div class="emoji-picker-modal" id="emojiModal">

        <button class="close-emoji-btn" id="closeOnlineModal">&times;</button>

  </div>

  <div id="notificationContainer"></div>

    const auth = getAuth(app);
    const database = getDatabase(app);
    const provider = new GoogleAuthProvider();

    let isAdmin = false;
    let pedidosCache = [];

      "oficina", "3", "negro", "piscina", "cade", "cade?", "deve", "paga", "ladrão", "lula", "Lula",
      "vadia", "janja", "jamja", "egoista", "cac", "nikolas", "esquerda", "direita", "mecânica", "bucetuda","gozar", "bosta", "merda", "cocô", "cagada", "cagado", "cagadao", "arrombado", "mercado", "chiqueiro", "http://", "https://","siga", "sigam", "sigam-me"

      "😀": ["😀","😃","😄","😁","😆","😅","😂","🤣","🥲","☺️","😊","😇","🙂","🙃","😉","😌","😍","🥰","😘","😗","😙","😚","😋","😛","😝","😜","🤪","🤨","🧐","🤓","😎","🥸","🤩","🥳","😏","😒","😞","😔","😟","😕","🙁","☹️","😣","😖","😫","😩","🥺","😢","😭","😤","😠","😡","🤬","🤯","😳","🥵","🥶","😱","😨","😰","😥","😓","🤗","🤔","🤭","🤫","🤥","😶","😐","😑","😬","🙄","😯","😦","😧","😮","😲","🥱","😴","🤤","😪","😵","🤐","🥴","🤢","🤮","🤧","😷","🤒","🤕"],

    function sanitizarTexto(str) {
      if (!str) return "";
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;")
        .replace(/javascript:/gi, "")
        .replace(/onload/gi, "")
        .replace(/onerror/gi, "");
    }

    const loginOverlay = document.getElementById('loginOverlay');
    const googleLoginBtn = document.getElementById('googleLoginBtn');
    const emojiModal = document.getElementById('emojiModal');
    const openEmojiModal = document.getElementById('openEmojiModal');
    const closeEmojiModal = document.getElementById('closeEmojiModal');
    const emojiTabs = document.getElementById('emojiTabs');
    const emojiGrid = document.getElementById('emojiGrid');
    const messageInput = document.getElementById('messageInput');
    const submitBtn = document.getElementById('submitMessage');
    const messagesContainer = document.getElementById('messagesContainer');
    const adminBar = document.getElementById('adminBar');

    googleLoginBtn.addEventListener('click', () => {
      signInWithPopup(auth, provider).catch(error => {
        alert("Erro no Login Google: " + error.message);
      });
    });

    Object.keys(emojiCategories).forEach((catIcon, index) => {
      const tabBtn = document.createElement('button');
      tabBtn.type = 'button';
      tabBtn.className = `emoji-tab-btn ${index === 0 ? 'active' : ''}`;
      tabBtn.textContent = catIcon;
      tabBtn.addEventListener('click', () => {
        document.querySelectorAll('.emoji-tab-btn').forEach(b => b.classList.remove('active'));
        tabBtn.classList.add('active');
        carregarEmojisCategoria(catIcon);
      });
      emojiTabs.appendChild(tabBtn);
    });

    function carregarEmojisCategoria(catIcon) {
      emojiGrid.innerHTML = '';
      emojiCategories[catIcon].forEach(emoji => {
        const item = document.createElement('span');
        item.className = 'emoji-item';
        item.textContent = emoji;
        item.addEventListener('click', () => {
          if (!messageInput.disabled) {
            messageInput.value += emoji;
            messageInput.focus();
            emojiModal.classList.remove('active');
          }
        });
        emojiGrid.appendChild(item);
      });
    }
    carregarEmojisCategoria("😀");

    openEmojiModal.addEventListener('click', () => {
      emojiModal.classList.toggle('active');
    });

    closeEmojiModal.addEventListener('click', () => {
      emojiModal.classList.remove('active');
    });

    // SISTEMA DE AUTENTICAÇÃO E REGISTRO DE PRESENÇA (ONLINE)
    onAuthStateChanged(auth, user => {
      if (user) {
        loginOverlay.style.display = 'none';
        messageInput.disabled = false;
        submitBtn.disabled = false;
        showNotification(`${user.displayName} entrou no chat!`);

        // REGISTRA PRESENÇA USANDO O UID FIXO COMO CHAVE (SEM DUPLICAR)
        const userPresenceRef = ref(database, `online_users/${user.uid}`);
        set(userPresenceRef, {
          name: user.displayName,
          email: user.email,
          photoURL: user.photoURL,
          loginAt: new Date().toISOString()
        });
        onDisconnect(userPresenceRef).remove();

        // VALIDA ACESSO ADMINISTRATIVO
        if (user.email === ADMIN_EMAIL) {
          isAdmin = true;
          adminBar.style.display = 'flex';
          carregarMonitoresAdmin();
        } else {
          isAdmin = false;
          adminBar.style.display = 'none';
        }
      } else {
        loginOverlay.style.display = 'flex';
        messageInput.disabled = true;
        submitBtn.disabled = true;
        adminBar.style.display = 'none';
      }
    });

    // ENVIO DE MENSAGENS E PEDIDOS
    submitBtn.addEventListener('click', async () => {
      let text = messageInput.value.trim();
      const user = auth.currentUser;

      if (!text || !user) return;

      // VERIFICA SE É UM PEDIDO DE MÚSICA (COMEÇA COM !)
      if (text.startsWith('!')) {
        const pedidoRef = ref(database, `pedidos/${user.uid}`);
        const snapshotPedido = await get(pedidoRef);

        if (snapshotPedido.exists() && !isAdmin) {
          alert("Você já tem um pedido em processamento! Aguarde o atendimento.");
          messageInput.value = text.replace(/^!/, "");
          return;
        }
      }

      text = sanitizarTexto(text);
      const lowerText = text.toLowerCase();

      if (bannedWords.some(word => lowerText.includes(word))) {
        alert("PALAVRA PROIBIDA! Mensagens contendo palavras inadequadas não são permitidas.");
        return;
      }

      const messageObj = {
        name: sanitizarTexto(user.displayName),
        email: user.email,
        photoURL: user.photoURL || "https://via.placeholder.com/150",
        message: text,
        timestamp: new Date().toISOString(),
        uid: user.uid
      };

      // SE FOR PEDIDO DE MÚSICA, ENVIA PARA O NÓ QUE O BOT ESCUTA
      if (text.startsWith('!')) {
        const newPedidoRef = push(ref(database, 'pedidos'));
        await set(newPedidoRef, {
          id: newPedidoRef.key,
          uid: user.uid,
          name: user.displayName,
          email: user.email,
          pedido: text.substring(1).trim(),
          data: new Date().toISOString()
        });
      }

      // PUBLICA NO CHAT GERAL
      push(ref(database, 'messages'), messageObj)
        .then(() => {
          messageInput.value = "";
          emojiModal.classList.remove('active');
        })
        .catch(console.error);
    });

    // ESCUTA DE MENSAGENS EM TEMPO REAL
    const messagesRef = ref(database, 'messages');
    const messagesQuery = query(messagesRef, limitToLast(20));

    onChildAdded(messagesQuery, (snapshot) => {
      renderMessage(snapshot.key, snapshot.val());
    });

    onChildRemoved(messagesRef, (snapshot) => {
      const msgEl = document.getElementById(`msg-${snapshot.key}`);
      if (msgEl) msgEl.remove();
    });

    onChildChanged(messagesRef, (snapshot) => {
      const msgEl = document.getElementById(`msg-${snapshot.key}`);
      if (msgEl) {
        const textEl = msgEl.querySelector('.text');
        if (textEl) textEl.textContent = snapshot.val().message;
      }
    });

    function renderMessage(key, msg) {
      if (document.getElementById(`msg-${key}`)) return;

      const isBot = msg.name === "Bot Power Dance" || msg.email === "bot@powerdance.com";
      const div = document.createElement('div');
      div.id = `msg-${key}`;
      div.className = `message ${isBot ? 'bot-msg' : ''}`;

      let adminControls = '';
      if (isAdmin) {
        adminControls = `
          <div class="admin-actions">
            <button class="admin-btn edit" onclick="window.editarMensagem('${key}', '${sanitizarTexto(msg.message)}')">Editar</button>
            <button class="admin-btn" onclick="window.apagarMensagem('${key}')">Apagar</button>
          </div>
        `;
      }

      div.innerHTML = `
        <img class="avatar" src="${msg.photoURL}" alt="${msg.name}">
        <div class="content">
          <div class="name">${msg.name}</div>
          <div class="email">${msg.email}</div>
          <div class="text">${msg.message}</div>
          <div class="timestamp">${new Date(msg.timestamp).toLocaleTimeString()}</div>
          ${adminControls}
        </div>
      `;

      messagesContainer.appendChild(div);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // MODERAÇÃO ADMIN
    window.apagarMensagem = (key) => {
      if (confirm("Deseja realmente apagar esta mensagem?")) {
        remove(ref(database, `messages/${key}`));
      }
    };

    window.editarMensagem = (key, currentText) => {
      const newText = prompt("Edite o texto da mensagem:", currentText);
      if (newText !== null && newText.trim() !== "") {
        set(ref(database, `messages/${key}/message`), sanitizarTexto(newText.trim()));
      }
    };

    // PAINEL E HISTÓRICO ADMINISTRATIVO
    function carregarMonitoresAdmin() {
      // LISTENER USUÁRIOS ONLINE
      onValue(ref(database, 'online_users'), (snapshot) => {
        const data = snapshot.val() || {};
        const count = Object.keys(data).length;
        document.getElementById('onlineCount').textContent = count;

        const listEl = document.getElementById('onlineList');
        listEl.innerHTML = '';

        Object.entries(data).forEach(([uid, u]) => {
          const item = document.createElement('div');
          item.className = 'history-item';
          item.innerHTML = `
            <strong>${u.name}</strong> (${u.email})<br>
            <small>Conectado em: ${new Date(u.loginAt).toLocaleString()}</small>
          `;
          listEl.appendChild(item);
        });
      });

      // LISTENER HISTÓRICO DE PEDIDOS
      onValue(ref(database, 'pedidos'), (snapshot) => {
        pedidosCache = [];
        const data = snapshot.val() || {};
        const historyEl = document.getElementById('historyList');
        historyEl.innerHTML = '';

        Object.entries(data).forEach(([key, p]) => {
          pedidosCache.push(p);
          const item = document.createElement('div');
          item.className = 'history-item';
          item.innerHTML = `
            <strong>Nome:</strong> ${p.name || 'Anônimo'} | <strong>Email:</strong> ${p.email || 'N/A'}<br>
            <strong>Pedido:</strong> ${p.pedido || p.message || ''}<br>
            <small>Data/Hora: ${new Date(p.data || p.timestamp).toLocaleString()}</small>
          `;
          historyEl.appendChild(item);
        });
      });
    }

    // EXPORTAÇÃO DO RELATÓRIO DE PEDIDOS EM TXT
    document.getElementById('btnExportTxt').addEventListener('click', () => {
      if (pedidosCache.length === 0) {
        alert("Não há pedidos registrados para exportar!");
        return;
      }

      let content = "===== RELATÓRIO DE PEDIDOS - WEB RÁDIO POWER DANCE =====\n";
      content += `Data do Relatório: ${new Date().toLocaleString()}\n`;
      content += "========================================================\n\n";

      pedidosCache.forEach((p, idx) => {
        content += `[#${idx + 1}] - ${new Date(p.data || p.timestamp).toLocaleString()}\n`;
        content += `Ouvinte: ${p.name || 'Desconhecido'}\n`;
        content += `E-mail: ${p.email || 'N/A'}\n`;
        content += `Pedido/Música: ${p.pedido || p.message || ''}\n`;
        content += "--------------------------------------------------------\n";
      });

      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `relatorio_pedidos_powerdance_${Date.now()}.txt`;
      link.click();
    });

    // ABERTURA/FECHAMENTO DE MODAIS
    document.getElementById('btnOpenHistory').addEventListener('click', () => {
      document.getElementById('modalHistory').classList.add('active');
    });

    document.getElementById('closeHistoryModal').addEventListener('click', () => {
      document.getElementById('modalHistory').classList.remove('active');
    });

    document.getElementById('btnOpenOnline').addEventListener('click', () => {
      document.getElementById('modalOnline').classList.add('active');
    });

    document.getElementById('closeOnlineModal').addEventListener('click', () => {
      document.getElementById('modalOnline').classList.remove('active');
    });

    function showNotification(text) {
      const el = document.createElement('div');
      el.className = 'notification';
      el.textContent = text;
      document.getElementById('notificationContainer').appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }
  </script>

  <script>
    const msgInput = document.getElementById('messageInput');

    msgInput.addEventListener('paste', function(e) {
      e.preventDefault();
      alert("Por segurança da Rádio, colar textos externos é proibido. Digite sua mensagem manualmente!");
      return false;
    });

    msgInput.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && (e.key === 'v' || e.key === 'V')) {
        e.preventDefault();
        alert("Atalho de colar desativado por motivos de segurança.");
        return false;
      }
    });

    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if (e.key === 'F12' || e.keyCode === 123) {
        e.preventDefault();
        return false;
      }
    });
  </script>
</body>
</html>
